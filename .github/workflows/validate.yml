name: Validate Lynis custom tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate POSIX shell syntax
        run: |
          sh -n tests_custom
          sh -n tests/smoke.sh
      - name: Run mocked Lynis regression scenarios
        run: sh tests/smoke.sh
