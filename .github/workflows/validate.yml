name: Shell validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX shell syntax
        run: |
          sh -n tests_custom
          sh -n tests_firewall_macos
          sh -n tests/smoke.sh
      - name: Run mock-based regression tests
        run: sh tests/smoke.sh
